<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIFTFLOW | TRADE ANALYZER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e17;
            color: #eef3fc;
            min-height: 100vh;
            position: relative;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 150, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 100, 255, 0.06) 0%, transparent 50%),
                        linear-gradient(135deg, #0a0d16 0%, #121725 100%);
            z-index: -2;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 150, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px;
            position: relative;
            z-index: 2;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 20px 0 40px;
            flex-wrap: nowrap;
        }

        .tab {
            padding: 14px 32px;
            background: rgba(18, 25, 40, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 160, 255, 0.1);
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            color: #a0b3d9;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .tab:hover {
            background: rgba(30, 45, 70, 0.8);
            border-color: rgba(0, 180, 255, 0.4);
            color: #fff;
        }

        .tab.active {
            background: #1a2a41;
            color: #fff;
            border-color: #2d8cff;
            box-shadow: 0 10px 25px rgba(0, 140, 255, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0.6; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== SECTION 1: CALCULATOR ========== */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #4f6a9c;
            margin-bottom: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(16, 22, 36, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 28px;
            border: 1px solid rgba(0, 160, 255, 0.15);
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
        }

        .stat-label {
            font-size: 14px;
            color: #8095c0;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .stat-number {
            font-size: 42px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0,160,255,0.3);
        }

        .stat-number.profit { color: #2d8cff; }
        .stat-number.profit.negative { color: #9b59b6; }

        .trades-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 30px 0;
        }

        .trade-item {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr 0.8fr 100px 40px;
            gap: 12px;
            align-items: center;
            background: rgba(12, 18, 30, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 16px 18px;
            border: 1px solid rgba(0, 150, 255, 0.1);
            transition: all 0.2s;
        }

        .trade-item:hover {
            border-color: rgba(0, 170, 255, 0.3);
            background: rgba(18, 26, 42, 0.8);
        }

        .trade-input {
            background: rgba(8, 12, 22, 0.8);
            border: 1px solid #25344d;
            border-radius: 18px;
            padding: 14px 18px;
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            width: 100%;
            transition: 0.2s;
        }

        .trade-input:focus {
            outline: none;
            border-color: #2d8cff;
            background: #101b2b;
            box-shadow: 0 0 0 3px rgba(45, 140, 255, 0.15);
        }

        .profit-badge {
            font-weight: 600;
            text-align: right;
            padding-right: 10px;
            font-size: 16px;
        }

        .profit-badge.positive { color: #2d8cff; }
        .profit-badge.negative { color: #9b59b6; }

        .delete-btn {
            background: none;
            border: none;
            color: #65799e;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 16px;
            line-height: 1;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #2a1f2f;
            color: #ff7b9c;
        }

        .add-btn {
            width: 100%;
            background: rgba(0, 140, 255, 0.05);
            border: 1.5px dashed #2d8cff;
            border-radius: 30px;
            padding: 20px;
            color: #aac9ff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            backdrop-filter: blur(5px);
        }

        .add-btn:hover {
            background: rgba(0, 140, 255, 0.12);
            color: #fff;
            border-color: #4da6ff;
        }

        /* ========== SECTION 2: ANALYZER ========== */
        .analyzer-container {
            background: rgba(16, 22, 36, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 50px 40px;
            border: 1px solid rgba(0, 160, 255, 0.15);
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 30px 50px -20px rgba(0,0,0,0.7);
        }

        .input-group {
            margin-bottom: 30px;
        }

        .input-label {
            font-size: 14px;
            font-weight: 500;
            color: #809ac9;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .input-field {
            width: 100%;
            background: rgba(8, 12, 22, 0.8);
            border: 1px solid #2a3850;
            border-radius: 30px;
            padding: 20px 24px;
            color: #fff;
            font-size: 18px;
            font-family: 'Inter', sans-serif;
        }

        .input-field:focus {
            outline: none;
            border-color: #2d8cff;
            background: #0f1a28;
        }

        .percentage-box {
            text-align: center;
            margin: 50px 0 30px;
        }

        .percentage-value {
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #80b4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            filter: drop-shadow(0 10px 20px rgba(0,160,255,0.4));
        }

        .verdict {
            text-align: center;
            padding: 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .verdict.high {
            background: rgba(45, 140, 255, 0.12);
            color: #2d8cff;
            border: 1px solid rgba(45, 140, 255, 0.3);
        }

        .verdict.medium {
            background: rgba(255, 193, 84, 0.12);
            color: #ffb347;
            border: 1px solid rgba(255, 193, 84, 0.3);
        }

        .verdict.low {
            background: rgba(155, 89, 182, 0.12);
            color: #9b59b6;
            border: 1px solid rgba(155, 89, 182, 0.3);
        }

        /* ========== SECTION 3: STATISTICS & ACCOUNT ========== */
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .account-actions {
            display: flex;
            gap: 12px;
        }

        .account-btn {
            background: #0e1a28;
            border: none;
            border-radius: 40px;
            padding: 16px 24px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #2d8cff;
            transition: 0.3s;
        }

        .account-btn:hover {
            background: #1a2d42;
            box-shadow: 0 10px 20px rgba(45, 140, 255, 0.3);
        }

        .account-btn.copy {
            background: #2d8cff;
        }

        .account-btn.paste {
            background: #9b59b6;
            border-color: #9b59b6;
        }

        .chart-wrapper {
            background: rgba(12, 18, 30, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 28px;
            height: 400px;
            border: 1px solid rgba(0, 150, 255, 0.15);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2a41;
            border: 1px solid #2d8cff;
            border-radius: 60px;
            padding: 16px 32px;
            color: #fff;
            font-weight: 600;
            z-index: 10000;
            display: none;
            animation: slideUp 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @keyframes slideUp {
            from { bottom: 50px; opacity: 0; }
            to { bottom: 100px; opacity: 1; }
        }

        /* Scroll button */
        .scroll-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: #132237;
            backdrop-filter: blur(8px);
            border: 1px solid #2d8cff;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            color: #8bb9ff;
            z-index: 1000;
            pointer-events: none;
        }

        .scroll-btn.show {
            opacity: 1;
            pointer-events: auto;
        }

        .scroll-btn:hover {
            background: #1e3450;
            color: #fff;
        }

        .scroll-btn svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .credit {
            text-align: center;
            margin-top: 80px;
            font-size: 14px;
            color: #4c6085;
        }

        .credit a {
            color: #7fa3e0;
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 800px) {
            .trade-item {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .profit-badge {
                text-align: left;
                padding-left: 10px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .analyzer-container {
                padding: 30px 20px;
            }
            
            .percentage-value {
                font-size: 80px;
            }
            
            .tabs {
                gap: 8px;
            }
            
            .tab {
                padding: 12px 20px;
                font-size: 13px;
            }

            .chart-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .account-actions {
                width: 100%;
                justify-content: space-between;
            }

            .account-btn {
                padding: 14px 20px;
                font-size: 13px;
            }
        }
    </style>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grid-overlay"></div>

    <div class="container">
        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" data-tab="calc">CALCULATOR</div>
            <div class="tab" data-tab="analyze">ANALYZER</div>
            <div class="tab" data-tab="stats">STATISTICS</div>
        </div>

        <!-- TAB 1: CALCULATOR -->
        <div id="calc" class="tab-content active">
            <div class="section-title">TRADE DASHBOARD</div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">TOTAL INVESTMENT</div>
                    <div class="stat-number" id="totalInvestment">0.00 TON</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">TOTAL PROFIT</div>
                    <div class="stat-number profit" id="totalProfit">0.00 TON</div>
                </div>
            </div>

            <div id="tradesList" class="trades-container"></div>

            <button class="add-btn" id="addTradeBtn">+ ADD NEW TRADE</button>
        </div>

        <!-- TAB 2: ANALYZER -->
        <div id="analyze" class="tab-content">
            <div class="analyzer-container">
                <div class="section-title" style="text-align: center;">GIFT VALUE SCORE</div>
                
                <div class="input-group">
                    <div class="input-label">PRICE (TON)</div>
                    <input type="text" id="priceInput" class="input-field" placeholder="0.00">
                </div>

                <div class="input-group">
                    <div class="input-label">SUPPLY</div>
                    <input type="text" id="supplyInput" class="input-field" placeholder="0">
                </div>

                <div class="input-group">
                    <div class="input-label">GIFT PERCENTAGE (%)</div>
                    <input type="text" id="percentInput" class="input-field" placeholder="0">
                </div>

                <div class="percentage-box">
                    <div class="percentage-value" id="percentageDisplay">0%</div>
                </div>

                <div class="verdict" id="verdictDisplay">ENTER VALUES</div>
            </div>
        </div>

        <!-- TAB 3: STATISTICS & ACCOUNT -->
        <div id="stats" class="tab-content">
            <div class="chart-header">
                <div class="section-title">PROFIT HISTORY</div>
                <div class="account-actions">
                    <button class="account-btn copy" id="copyAccountBtn">
                        📋 COPY ACCOUNT
                    </button>
                    <button class="account-btn paste" id="pasteAccountBtn">
                        📂 PASTE ACCOUNT
                    </button>
                </div>
            </div>

            <div class="chart-wrapper">
                <canvas id="profitChart"></canvas>
            </div>
        </div>

        <!-- Scroll Button -->
        <div class="scroll-btn" id="scrollBtn">
            <svg viewBox="0 0 24 24" id="scrollSvg">
                <path d="M12 5v14m0 0l-6-6m6 6l6-6" />
            </svg>
        </div>

        <!-- Toast for notifications -->
        <div class="toast" id="toast"></div>

        <!-- Credit -->
        <div class="credit">
            <a href="https://t.me/geloriu" target="_blank">@geloriu</a> • engineered with precision
        </div>
    </div>

    <script>
        // ========== TAB SYSTEM ==========
        const tabs = document.querySelectorAll('.tab');
        const contents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                contents.forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // ========== CALCULATOR SECTION ==========
        let trades = JSON.parse(localStorage.getItem('gift_trades_v5')) || [];
        let nextId = trades.length ? Math.max(...trades.map(t => t.id)) + 1 : 1;

        const tradesList = document.getElementById('tradesList');
        const totalInvestmentEl = document.getElementById('totalInvestment');
        const totalProfitEl = document.getElementById('totalProfit');
        const toast = document.getElementById('toast');

        function showToast(message, isSuccess = true) {
            toast.style.display = 'block';
            toast.textContent = message;
            toast.style.background = isSuccess ? '#1a2a41' : '#4a1a2a';
            toast.style.borderColor = isSuccess ? '#2d8cff' : '#9b59b6';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        function calculateProfit(buy, sell) {
            const b = parseFloat(buy) || 0;
            const s = parseFloat(sell) || 0;
            return s - b;
        }

        function updateStats() {
            let investment = 0;
            let totalProfit = 0;

            trades.forEach(t => {
                const buy = parseFloat(t.buy) || 0;
                const sell = parseFloat(t.sell) || 0;
                investment += buy;
                totalProfit += calculateProfit(buy, sell);
            });

            totalInvestmentEl.textContent = investment.toFixed(2) + ' TON';
            totalProfitEl.textContent = totalProfit.toFixed(2) + ' TON';
            
            if (totalProfit >= 0) {
                totalProfitEl.classList.add('profit');
                totalProfitEl.classList.remove('negative');
            } else {
                totalProfitEl.classList.add('negative');
                totalProfitEl.classList.remove('profit');
            }

            updateChart();
        }

        function saveTrades() {
            localStorage.setItem('gift_trades_v5', JSON.stringify(trades));
            updateStats();
        }

        function updateRowProfit(rowElement, trade) {
            const buy = parseFloat(trade.buy) || 0;
            const sell = parseFloat(trade.sell) || 0;
            const profit = calculateProfit(buy, sell);
            const profitBadge = rowElement.querySelector('.profit-badge');
            profitBadge.textContent = (profit >= 0 ? '+' : '') + profit.toFixed(2);
            profitBadge.className = 'profit-badge ' + (profit >= 0 ? 'positive' : 'negative');
        }

        function createTradeRow(trade) {
            const row = document.createElement('div');
            row.className = 'trade-item';
            row.dataset.id = trade.id;

            const profit = calculateProfit(trade.buy, trade.sell);
            const profitClass = profit >= 0 ? 'positive' : 'negative';

            row.innerHTML = `
                <input type="text" class="trade-input name-input" placeholder="Trade name" value="${trade.name || ''}">
                <input type="text" class="trade-input buy-input" placeholder="Buy price" value="${trade.buy || ''}">
                <input type="text" class="trade-input sell-input" placeholder="Sell price" value="${trade.sell || ''}">
                <div class="profit-badge ${profitClass}">${profit >= 0 ? '+' : ''}${profit.toFixed(2)}</div>
                <button class="delete-btn">×</button>
            `;

            const nameInput = row.querySelector('.name-input');
            const buyInput = row.querySelector('.buy-input');
            const sellInput = row.querySelector('.sell-input');
            const deleteBtn = row.querySelector('.delete-btn');

            nameInput.addEventListener('input', (e) => {
                trade.name = e.target.value;
                saveTrades();
            });

            buyInput.addEventListener('input', (e) => {
                trade.buy = e.target.value;
                updateRowProfit(row, trade);
                saveTrades();
            });

            sellInput.addEventListener('input', (e) => {
                trade.sell = e.target.value;
                updateRowProfit(row, trade);
                saveTrades();
            });

            buyInput.addEventListener('wheel', (e) => e.preventDefault());
            sellInput.addEventListener('wheel', (e) => e.preventDefault());

            deleteBtn.addEventListener('click', () => {
                deleteTrade(trade.id);
            });

            return row;
        }

        function renderTrades() {
            tradesList.innerHTML = '';

            if (trades.length === 0) {
                trades.push({ id: nextId++, name: '', buy: '', sell: '' });
            }

            trades.forEach(trade => {
                const row = createTradeRow(trade);
                tradesList.appendChild(row);
            });
        }

        window.deleteTrade = function(id) {
            if (trades.length > 1) {
                trades = trades.filter(t => t.id !== id);
            } else {
                const trade = trades.find(t => t.id === id);
                if (trade) {
                    trade.name = '';
                    trade.buy = '';
                    trade.sell = '';
                }
            }
            saveTrades();
            renderTrades();
        };

        document.getElementById('addTradeBtn').addEventListener('click', () => {
            trades.push({ id: nextId++, name: '', buy: '', sell: '' });
            saveTrades();
            renderTrades();
        });

        // ========== ANALYZER SECTION ==========
        const priceInput = document.getElementById('priceInput');
        const supplyInput = document.getElementById('supplyInput');
        const percentInput = document.getElementById('percentInput');
        const percentageDisplay = document.getElementById('percentageDisplay');
        const verdictDisplay = document.getElementById('verdictDisplay');

        function calculateGiftScore() {
            const price = parseFloat(priceInput.value) || 0;
            const supply = parseFloat(supplyInput.value) || 0;
            const percent = parseFloat(percentInput.value) || 0;

            if (!price || !supply || !percent) {
                percentageDisplay.textContent = '0%';
                verdictDisplay.textContent = 'ENTER VALUES';
                verdictDisplay.className = 'verdict';
                return;
            }

            const maxPrice = 10000;
            const minPrice = 4.3;
            let priceScore;
            if (price <= minPrice) priceScore = 1;
            else if (price >= maxPrice) priceScore = 0;
            else priceScore = 1 - ((price - minPrice) / (maxPrice - minPrice));

            const maxSupply = 500000;
            const minSupply = 300;
            let supplyScore;
            if (supply <= minSupply) supplyScore = 1;
            else if (supply >= maxSupply) supplyScore = 0;
            else supplyScore = 1 - ((supply - minSupply) / (maxSupply - minSupply));

            let percentScore = 1 - (Math.min(percent, 100) / 100);
            percentScore = percentScore * 0.5 + 0.5;

            const finalScore = (priceScore * 0.5 + supplyScore * 0.3 + percentScore * 0.2) * 100;
            const displayPercentage = Math.min(100, Math.max(0, Math.round(finalScore)));
            
            percentageDisplay.textContent = displayPercentage + '%';

            if (displayPercentage >= 70) {
                verdictDisplay.textContent = '🔥 HIGH VALUE';
                verdictDisplay.className = 'verdict high';
            } else if (displayPercentage >= 40) {
                verdictDisplay.textContent = '⚡ MEDIUM VALUE';
                verdictDisplay.className = 'verdict medium';
            } else {
                verdictDisplay.textContent = '💤 LOW VALUE';
                verdictDisplay.className = 'verdict low';
            }
        }

        priceInput.addEventListener('input', calculateGiftScore);
        supplyInput.addEventListener('input', calculateGiftScore);
        percentInput.addEventListener('input', calculateGiftScore);

        // ========== CHART ==========
        let chart;
        
        function updateChart() {
            const ctx = document.getElementById('profitChart').getContext('2d');
            
            const labels = trades.map((_, i) => `#${i + 1}`);
            const profits = trades.map(t => {
                const buy = parseFloat(t.buy) || 0;
                const sell = parseFloat(t.sell) || 0;
                return sell - buy;
            });

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Profit (TON)',
                        data: profits,
                        backgroundColor: profits.map(p => p >= 0 ? '#2d8cff' : '#9b59b6'),
                        borderRadius: 10,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            grid: { color: '#25344d' },
                            ticks: { color: '#a0b3d9' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#a0b3d9' }
                        }
                    }
                }
            });
        }

        // ========== ACCOUNT COPY/PASTE SYSTEM ==========
        document.getElementById('copyAccountBtn').addEventListener('click', function() {
            // Create a compact string of all trades
            const accountData = {
                version: '1.0',
                timestamp: new Date().toISOString(),
                trades: trades.map(t => ({
                    id: t.id,
                    name: t.name || '',
                    buy: t.buy || '',
                    sell: t.sell || ''
                }))
            };
            
            // Convert to base64 for clean copy
            const jsonString = JSON.stringify(accountData);
            const base64Data = btoa(encodeURIComponent(jsonString));
            
            // Create Telegram-style message
            const message = `📊 GIFTFLOW ACCOUNT BACKUP\n\n${base64Data}\n\nSend this to @geloriu to restore your trades.`;
            
            // Copy to clipboard
            navigator.clipboard.writeText(message).then(() => {
                showToast('✅ Account copied to clipboard!');
            }).catch(() => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = message;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ Account copied to clipboard!');
            });
        });

        document.getElementById('pasteAccountBtn').addEventListener('click', function() {
            // Create a prompt for pasting
            const pastedText = prompt('Paste your account backup here:');
            
            if (!pastedText) return;
            
            try {
                // Extract base64 from message
                const base64Match = pastedText.match(/[A-Za-z0-9+/=]{50,}/);
                
                if (!base64Match) {
                    throw new Error('Invalid backup format');
                }
                
                const base64Data = base64Match[0];
                const jsonString = decodeURIComponent(atob(base64Data));
                const accountData = JSON.parse(jsonString);
                
                if (accountData.version && accountData.trades && Array.isArray(accountData.trades)) {
                    // Restore trades
                    trades = accountData.trades;
                    
                    // Update nextId
                    nextId = trades.length ? Math.max(...trades.map(t => t.id)) + 1 : 1;
                    
                    // Save and rerender
                    saveTrades();
                    renderTrades();
                    
                    showToast('✅ Account restored successfully!');
                } else {
                    throw new Error('Invalid account data');
                }
            } catch (error) {
                showToast('❌ Invalid backup format', false);
            }
        });

        // ========== SCROLL BUTTON ==========
        const scrollBtn = document.getElementById('scrollBtn');
        const scrollSvg = document.getElementById('scrollSvg');
        let lastScrollTop = 0;

        function updateScrollButton() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;
            const atTop = scrollTop < 50;
            const atBottom = documentHeight - (scrollTop + windowHeight) < 50;

            if (scrollTop > lastScrollTop) {
                // Scrolling down
                if (!atBottom) {
                    scrollSvg.innerHTML = '<path d="M12 5v14m0 0l-6-6m6 6l6-6" />';
                    scrollBtn.classList.add('show');
                    scrollBtn.onclick = () => {
                        window.scrollTo({ top: documentHeight, behavior: 'smooth' });
                        scrollBtn.classList.remove('show');
                    };
                } else {
                    scrollBtn.classList.remove('show');
                }
            } else if (scrollTop < lastScrollTop) {
                // Scrolling up
                if (!atTop) {
                    scrollSvg.innerHTML = '<path d="M12 19V5m0 0l-6 6m6-6l6 6" />';
                    scrollBtn.classList.add('show');
                    scrollBtn.onclick = () => {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        scrollBtn.classList.remove('show');
                    };
                } else {
                    scrollBtn.classList.remove('show');
                }
            } else {
                scrollBtn.classList.remove('show');
            }
            
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }

        window.addEventListener('scroll', updateScrollButton);
        window.addEventListener('resize', updateScrollButton);

        // ========== INIT ==========
        renderTrades();
        updateStats();
        calculateGiftScore();
    </script>
</body>
</html>
